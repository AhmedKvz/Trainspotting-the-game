<script>
'use strict';
const CV=document.getElementById('c');
const W=CV.width=800,H=CV.height=500;
const cx=CV.getContext('2d');
const PI2=Math.PI*2;
const rn=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rn(a,b));
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

// ── PERSPECTIVE ─────────────────────────────────
const VY=132,NY=438,NS=0.83;
const WX=-312,WHT=148,WLN=0.21,WGAP=0.05;
// ── KOMPOZICIJA PO KOJOJ TRČIMO (preskakanje vagona) ──
// TLN = dužina krova vagona, TGAP = procep između vagona (mora da se preskoči)
// PLZ = dubina na kojoj stoji igrač, ROOFW = poluširina krova
const TLN=0.62,TGAP=0.10,PLZ=0.05,ROOFW=252;
function prj(wx,wz){const t=1-cl(wz,0,1);return{x:W/2+wx*t*NS,y:VY+t*(NY-VY),s:t};}

// ── CHARACTERS ──────────────────────────────────
const CHARS=[
  {id:'ramiz', name:'Ramiz',          emoji:'🎤',
   desc:'Balkan legenda — Speed i Krek duplo jači',

const DRUGS=[

];

// ── AUDIO ────────────────────────────────────────
let AC;
function ga(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function snd(f,d,v=0.2,t='sine'){
  if(MUTED)return;
  try{const a=ga(),o=a.createOscillator(),g=a.createGain();
    o.type=t;o.frequency.setValueAtTime(f,a.currentTime);
    g.gain.setValueAtTime(v,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
  }catch(e){}
}
function sndSnort(){
  if(MUTED)return;
  try{const a=ga(),buf=a.createBuffer(1,Math.floor(a.sampleRate*0.14),a.sampleRate);
    const dt=buf.getChannelData(0);
    for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/dt.length,3)*0.95;
    const src=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
    src.buffer=buf;f.type='highpass';f.frequency.value=1500;
    g.gain.setValueAtTime(0.75,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.14);
    src.connect(f);f.connect(g);g.connect(a.destination);src.start();
  }catch(e){}
}
function sndCrack(){
  if(MUTED)return;
  try{const a=ga();
    for(let i=0;i<7;i++){
      setTimeout(()=>{
        const buf=a.createBuffer(1,Math.floor(a.sampleRate*0.028),a.sampleRate);
        const d=buf.getChannelData(0);
        for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2)*0.9;
        const src=a.createBufferSource(),g=a.createGain();
        src.buffer=buf;g.gain.setValueAtTime(0.45,a.currentTime);
        src.connect(g);g.connect(a.destination);src.start();
      },i*48);
    }
    setTimeout(()=>snd(1600,0.08,0.22,'square'),80);
  }catch(e){}
}
function sndMom(){
  if(MUTED)return;
  [0,380,760].forEach(i=>setTimeout(()=>{
    snd(880,0.12,0.32,'square');
    setTimeout(()=>snd(660,0.09,0.2,'square'),140);
  },i));
}
// Majka-prepreka: grebava, nazalna "GDE JE MOJE ZLATO?!"
function sndMother(){
  if(MUTED)return;
  const seq=[[300,0.13],[250,0.11],[330,0.12],[290,0.11],[225,0.15],[320,0.24]];
  seq.forEach(([f,d],i)=>setTimeout(()=>{
    snd(f,d,0.32,'sawtooth');snd(f*2.02,d*0.7,0.07,'square');
  },i*145));
}
// Beba: cviljenje sa vibratom (dva plača)
function sndBaby(){
  if(MUTED)return;
  try{const a=ga();
    [0,520].forEach(off=>{
      const o=a.createOscillator(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
      o.type='sawtooth';const t0=a.currentTime+off/1000;
      o.frequency.setValueAtTime(640,t0);
      o.frequency.linearRampToValueAtTime(980,t0+0.18);
      o.frequency.linearRampToValueAtTime(720,t0+0.46);
      lfo.frequency.value=12;lg.gain.value=42;lfo.connect(lg);lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.26,t0+0.06);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.47);
      o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+0.5);lfo.start(t0);lfo.stop(t0+0.5);
    });
  }catch(e){}
}
// Policijska sirena (jedan zavoj — poziva se u petlji tokom racije)
function sndSiren(){
  if(MUTED)return;
  try{const a=ga(),o=a.createOscillator(),g=a.createGain();
    o.type='sawtooth';const t0=a.currentTime;
    o.frequency.setValueAtTime(720,t0);
    o.frequency.linearRampToValueAtTime(1000,t0+0.32);
    o.frequency.linearRampToValueAtTime(720,t0+0.66);
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.13,t0+0.08);
    g.gain.setValueAtTime(0.13,t0+0.56);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.68);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+0.7);
  }catch(e){}
}

// ── STORAGE (window.storage > localStorage fallback) ──
const STORE={
  async get(k){
    try{if(window.storage&&window.storage.get){const r=await window.storage.get(k);return r?r.value:null;}}catch(e){}
    try{return localStorage.getItem(k);}catch(e){return null;}
  },
  async set(k,v){
    try{if(window.storage&&window.storage.set){await window.storage.set(k,v);return;}}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  },
};

// ── LEADERBOARD ──────────────────────────────────
let LB=[];
async function loadLB(){try{const v=await STORE.get('ts_lb_v3');LB=v?JSON.parse(v):[];}catch(e){LB=[];}}
async function saveLB(score,charName,cause){
  LB.push({score:Math.floor(score),char:charName,cause,d:new Date().toLocaleDateString('sr')});
  LB.sort((a,b)=>b.score-a.score);
  LB=LB.slice(0,10);
  try{await STORE.set('ts_lb_v3',JSON.stringify(LB));}catch(e){}
}
loadLB();

// ── SETTINGS (mute, persisted) ───────────────────
let MUTED=false;
(async()=>{try{MUTED=(await STORE.get('ts_muted'))==='1';}catch(e){}})();
function toggleMute(){MUTED=!MUTED;STORE.set('ts_muted',MUTED?'1':'0');if(!MUTED)snd(660,0.08,0.12);}

// ── HAPTICS (Vibration API) ──────────────────────
function vib(p){if(MUTED)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ── WAGON FACTORY ────────────────────────────────
function mkWagon(wz){
  const h=ri(0,40);
  return{wz,
    col:`hsl(${5+h},${18+rn(0,16)}%,${13+rn(0,13)}%)`,
    colTop:`hsl(${5+h},${14+rn(0,12)}%,${24+rn(0,8)}%)`,
    num:String(3200+ri(0,6800)),
    rust:Array.from({length:8},()=>({x:Math.random(),y:0.08+rn(0,0.82),r:0.018+rn(0,0.055),a:rn(0,Math.PI)})),
    grn:Math.random()>0.52,grfHue:120+ri(0,60),
  };
}

// ── SEGMENT KOMPOZICIJE (krov po kome trčimo) ────
let segId=0;
function mkSeg(wz){
  return{wz,id:segId++,len:TLN*(Math.random()<0.3?1.7:1),
    h:8+ri(0,26),sat:14+ri(0,12),lig:12+ri(0,7),
    grf:Math.random()>0.62,gh:110+ri(0,90),
    num:String(3200+ri(0,6800)),
    rust:Array.from({length:6},()=>({u:rn(-0.85,0.85),v:rn(0.08,0.92),r:rn(0.022,0.062)})),
  };
}
// da li je dubina wz na nekom vagonu (null = procep)
function segAt(wz){
  for(const s of G.train)if(wz>=s.wz&&wz<=s.wz+s.len)return s;
  return null;
}
// pomeri željenu dubinu na bezbedno mesto NA vagonu (za spawn prepreka/zlata)
function safeWz(want,span=0){
  let best=null,bd=1e9;
  for(const s of G.train){
    const lo=s.wz+0.12,hi=s.wz+s.len-0.12-span;
    if(hi<=lo)continue;
    if(want>=lo&&want<=hi)return want;
    const c=(lo+hi)/2,d=Math.abs(c-want);
    if(d<bd){bd=d;best=c;}
  }
  return best!==null?best:want;
}

// ── STATE ────────────────────────────────────────
const LANES=[-210,0,210];
const cW=162,cH=230,cGap=12,cY=H/2-115+15;
function charCardX(i){return(W-CHARS.length*(cW+cGap)+cGap)/2+i*(cW+cGap);}
let isPortrait=false,G;

function newGame(charId){
  const ch=CHARS.find(c=>c.id===charId)||CHARS[0];
  const wags=[];for(let i=0;i<10;i++)wags.push(mkWagon(0.02+i*(WLN+WGAP)));
  // kompozicija po kojoj trčimo — prvi segment pokriva igrača
  const train=[];{let z=-0.3;while(z<1.35){const sg=mkSeg(z);train.push(sg);z+=sg.len+TGAP;}}
  G={ph:'play',paused:false,t:0,fr:0,score:0,spd:0.008,hue:0,shk:0,msg:'',msgT:0,
    ch,deathCause:'crash',wasOD:false,streak:0,lastHard:'',ovT:0,
    anxiety:0,panics:0,panicT:0,urgentT:3000,
    mom:{active:false,timer:40000+rn(0,20000),activeT:0},
    suvAlert:false,suvAlertT:0,crashKind:'low',
    raid:{active:false,warn:0,t:0,timer:22000+rn(0,16000),prox:0,sirenT:0,survived:0},
    p:{lane:1,wx:0,jy:0,jv:0,gnd:true,eff:null,effEnd:0,mj:1,ji:0,landT:0,wasGnd:true,stepSign:0},
    obs:[],pkp:[],parts:[],wags,obT:2400,pkT:2500,
    gold:[],pops:[],coins:0,coinT:5000,goldMsg:false,curSp:0.008,
    train,lastSeg:train[0].id,wagons:0};
}
G={ph:'charselect',t:0,fr:0,hoverChar:-1,ch:CHARS[0]};

// ── RESIZE / ORIENTATION ─────────────────────────
function resize(){
  isPortrait=false; // igra radi u svakoj orijentaciji
  const vw=window.innerWidth,vh=window.innerHeight;
  const scale=Math.min(vw/W,vh/H);
  CV.style.width=W*scale+'px';
  CV.style.height=H*scale+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

// ── INPUT ────────────────────────────────────────
const KS={};
let tx0=null,ty0=null,tt0=0,lastSwipe=0;

addEventListener('keydown',e=>{
  if(KS[e.code])return;KS[e.code]=true;
  if(e.code==='KeyM'){toggleMute();syncUI();return;}
  if(G.ph==='play'&&(e.code==='KeyP'||e.code==='Escape')){togglePause();e.preventDefault();return;}
  if(G.paused)return;
  if(G.ph==='overdose')return;
  if(G.ph==='charselect')return;
  if(G.ph==='dead'){G.ph='charselect';G.hoverChar=-1;return;}
  if(G.ph!=='play')return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){mvL(-1);e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){mvL(1);e.preventDefault();}
  else if(['Space','ArrowUp','KeyW'].includes(e.code)){doJump();e.preventDefault();}
});
addEventListener('keyup',e=>KS[e.code]=false);

CV.addEventListener('touchstart',e=>{
  const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;tt0=Date.now();
  e.preventDefault();
},{passive:false});

CV.addEventListener('touchend',e=>{
  if(tx0===null)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-tx0,dy=t.clientY-ty0;
  const elapsed=Math.max(1,Date.now()-tt0);
  const vx=Math.abs(dx)/elapsed,vy=Math.abs(dy)/elapsed;
  const now=Date.now();
  const r=CV.getBoundingClientRect();
  const mx=(t.clientX-r.left)*(W/r.width),my=(t.clientY-r.top)*(H/r.height);
  if(G.ph==='charselect'){
    CHARS.forEach((c,i)=>{const bx=charCardX(i);if(mx>=bx&&mx<=bx+cW&&my>=cY&&my<=cY+cH)newGame(c.id);});
    tx0=null;return;
  }
  if(G.ph==='dead'){G.ph='charselect';G.hoverChar=-1;tx0=null;return;}
  if(G.ph!=='play'){tx0=null;return;}
  if(G.paused){togglePause();tx0=null;return;}
  if(now-lastSwipe<200){tx0=null;return;}
  if(vx>0.2&&Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy)*1.2){
    mvL(dx>0?1:-1);lastSwipe=now;
  }else if(dy<-20&&vy>0.16&&Math.abs(dy)>Math.abs(dx)){
    doJump();lastSwipe=now;
  }else if(Math.abs(dx)<20&&Math.abs(dy)<20&&elapsed<260){
    if(mx<W*0.3)mvL(-1);else if(mx>W*0.7)mvL(1);else doJump();
    lastSwipe=now;
  }
  tx0=null;
},{passive:false});

CV.addEventListener('pointermove',e=>{
  if(G.ph!=='charselect')return;
  const r=CV.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  G.hoverChar=-1;
  CHARS.forEach((c,i)=>{const bx=charCardX(i);if(mx>=bx&&mx<=bx+cW&&my>=cY&&my<=cY+cH)G.hoverChar=i;});
});
CV.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return;
  const r=CV.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  if(G.ph==='charselect'){CHARS.forEach((c,i)=>{const bx=charCardX(i);if(mx>=bx&&mx<=bx+cW&&my>=cY&&my<=cY+cH)newGame(c.id);});return;}
  if(G.ph==='dead'){G.ph='charselect';G.hoverChar=-1;return;}
  if(G.ph!=='play')return;
  if(G.paused){togglePause();return;}
  if(mx<W*0.3)mvL(-1);else if(mx>W*0.7)mvL(1);else doJump();
});

function mvL(d){const nl=cl(G.p.lane+d,0,2);if(nl!==G.p.lane){G.p.lane=nl;snd(300+d*70,0.08,0.12);}}
function doJump(){
  const p=G.p;if(p.ji>=p.mj)return;
  const isH=p.eff==='heroin'||p.eff==='ketamine';
  p.jv=isH?5:p.eff==='cocaine'?10:8;
  p.gnd=false;p.ji++;snd(280,0.12,0.18);
}
function addPop(x,y,txt,col){G.pops.push({x:x+rn(-8,8),y,txt,col,t:1100,t0:1100});}
function burst(x,y,col,n=12,f=5){
  for(let i=0;i<n;i++){
    const a=rn(0,PI2),sp=rn(0.5,1)*f;
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:rn(2,5),col,l:1,d:rn(0.03,0.07)});
  }
}

// ── UPDATE ───────────────────────────────────────
function update(dt){
  const p=G.p,ch=G.ch;
  G.t+=dt;G.fr++;G.score+=dt/60;
  if(G.score>0&&!G._hi)G._hi=0;
  G.spd=Math.min(0.0150,0.0075+G.score*0.000017);

  let sp=G.spd;
  const isH=p.eff==='heroin'||p.eff==='ketamine';
  if(isH)sp*=0.5;
  if(p.eff==='speed')sp*=(ch.bonus==='speed'?2.1:1.55);
  if(p.eff==='crack')sp*=2.6;
  if(p.eff==='weed')sp*=0.72;
  if(p.eff==='ecstasy')G.anxiety=Math.max(0,G.anxiety-4*dt/1000);
  if(p.eff&&Date.now()>p.effEnd){p.eff=null;p.mj=1;}
  if(p.eff==='acid')G.hue=(G.hue+3)%360;
  if(G.shk>0)G.shk=Math.max(0,G.shk-dt*0.025);
  if(G.msgT>0)G.msgT-=dt;
  if(G.panicT>0)G.panicT=Math.max(0,G.panicT-dt);

  // Anxiety
  if(p.eff)G.anxiety=Math.max(0,G.anxiety-3*dt/1000);
  else G.anxiety=Math.min(100,G.anxiety+ch.anxRate*0.9*(1+G.score*0.0015)*dt/1000*9);
  if(G.anxiety>=75)G.shk=Math.max(G.shk,(G.anxiety-75)/25*7);

  // XANAX emergency
  if(G.anxiety>87&&!p.eff){
    G.urgentT-=dt;
    if(G.urgentT<=0){
      G.pkp.push({lane:p.lane,wz:0.84,urgent:true,done:false,
        drug:{id:'weed',name:'XANAX',icon:'💊',col:'#0a3a7a',glo:'#00ccff',dur:7000,msg:'Dišeš... polako...',hard:false}});
      G.urgentT=8000;G.msg='💊 XANAX se približava!';G.msgT=1800;
    }
  }else if(G.anxiety<70)G.urgentT=Math.min(G.urgentT+dt,3000);

  // Panic attack
  if(G.anxiety>=100){
    if(G.panics>=2){G.deathCause='anxiety';die();return;}
    G.panics++;G.anxiety=44;G.panicT=3000;G.urgentT=0;vib([0,90,70,90,70,90]);
    G.shk=26;G.msg=`⚠ NAPADAJ PANIKE ${G.panics}/2 — uhvati XANAX!`;G.msgT=3000;
    snd(160,1.0,0.4,'sawtooth');setTimeout(()=>snd(140,0.7,0.28,'sawtooth'),400);
  }
  if(G.panicT>0)G.shk=Math.max(G.shk,9*(G.panicT/3000));

  // Mom call
  const mc=G.mom;mc.timer-=dt;
  if(mc.timer<=0&&!mc.active){
    mc.active=true;mc.activeT=4500;mc.timer=40000+rn(0,20000);
    G.suvAlert=true;G.suvAlertT=Math.max(G.suvAlertT,5500);
    sndMom();G.shk=Math.max(G.shk,6);
  }
  if(mc.active){mc.activeT-=dt;if(mc.activeT<=0)mc.active=false;}
  if(G.suvAlertT>0)G.suvAlertT-=dt;else G.suvAlert=false;

  // Police RAID — drugačija dinamika: SUV izlazi na šine i juri te
  const rd=G.raid;
  if(!rd.active){
    rd.timer-=dt;
    if(rd.timer<=0&&G.score>14){
      rd.active=true;rd.warn=2200;rd.t=7600;rd.prox=0;rd.sirenT=0;
      rd.timer=26000+rn(0,18000);
      G.msg='🚨 RACIJA! BEŽI OD POLICIJE!';G.msgT=2200;G.shk=Math.max(G.shk,12);
      vib([0,140,80,140]);sndSiren();
    }
  }else{
    rd.sirenT-=dt;if(rd.sirenT<=0){sndSiren();rd.sirenT=720;}
    if(rd.warn>0){
      rd.warn-=dt;rd.prox=Math.min(1,rd.prox+dt/2200);   // primiče se
    }else{
      rd.t-=dt;
      // diše ti za vratom: blizu na početku, izmičeš pred kraj
      const phase=rd.t/7600;
      rd.prox=cl(0.55+Math.sin(G.t/240)*0.12+(0.4-phase)*0.6,0,1);
      if(rd.t<=0){
        rd.active=false;rd.prox=0;rd.survived++;
        const bonus=60+G.score*0.04;G.score+=bonus;
        G.msg='😮‍💨 IZMAKAO SI POLICIJI! +'+Math.floor(bonus);G.msgT=2600;
        G.suvAlert=true;G.suvAlertT=1500;vib(60);
      }
    }
  }
  const raidOn=rd.active&&rd.warn<=0;

  // Lane / jump
  p.wx+=(LANES[p.lane]-p.wx)*0.13;
  p.jv-=isH?0.2:0.38;p.jy+=p.jv;
  if(p.jy<=0){p.jy=0;p.jv=0;p.gnd=true;p.ji=0;}
  G.curSp=sp;

  // Doskok — squash + prašina + tup zvuk
  if(p.gnd&&!p.wasGnd){
    p.landT=170;
    const lp=W/2+(p.wx-LANES[1])*0.44;
    for(let i=0;i<7;i++)G.parts.push({x:lp+rn(-20,20),y:NY+2,vx:rn(-1.6,1.6),vy:rn(-1.4,-0.2),r:rn(2,4.5),col:'rgba(140,115,88,0.7)',l:0.8,d:0.05});
    snd(75,0.09,0.14);vib(18);
  }
  p.wasGnd=p.gnd;
  if(p.landT>0)p.landT-=dt;

  // Koraci — tihi naizmenični takt dok trči
  if(p.gnd){
    const ss=Math.sin(G.t/130)>0?1:-1;
    if(ss!==p.stepSign){p.stepSign=ss;snd(ss>0?92:74,0.035,0.055);}
  }

  const dz=sp*dt/16.67;
  G.obs.forEach(o=>o.wz-=dz);
  G.pkp.forEach(q=>q.wz-=dz*(q.urgent?2.4:1));
  G.gold.forEach(g=>g.wz-=dz);
  G.wags.forEach(w=>w.wz-=dz);
  for(const pt of G.parts){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.15;pt.l-=pt.d;}
  for(const pp of G.pops){pp.y-=dt*0.045;pp.t-=dt;}

  G.obs=G.obs.filter(o=>o.wz>-0.06);
  G.pkp=G.pkp.filter(q=>q.wz>-0.06&&!q.done);
  G.gold=G.gold.filter(g=>g.wz>-0.06&&!g.done);
  G.pops=G.pops.filter(pp=>pp.t>0);
  G.parts=G.parts.filter(pt=>pt.l>0);
  G.wags=G.wags.filter(w=>w.wz+WLN>-0.08);
  const last=G.wags[G.wags.length-1];
  if(!last||last.wz+WLN<0.95)G.wags.push(mkWagon(last?last.wz+WLN+WGAP:0.5));

  // ── KOMPOZICIJA: pomeranje + recikliranje ──
  G.train.forEach(s=>s.wz-=dz);
  G.train=G.train.filter(s=>s.wz+s.len>-0.4);
  let lastT=G.train[G.train.length-1];
  while(!lastT||lastT.wz+lastT.len<1.35){
    G.train.push(mkSeg(lastT?lastT.wz+lastT.len+TGAP:0.6));
    lastT=G.train[G.train.length-1];
  }
  // preskočen vagon = bodovi
  const seg=segAt(PLZ);
  if(seg&&seg.id!==G.lastSeg){
    G.lastSeg=seg.id;G.wagons++;G.score+=12;
    addPop(W/2,NY-152,'+12 VAGON','#ffd447');
    snd(1245,0.06,0.1,'square');vib(10);
  }
  // pao u procep — ali sa coyote-time grace (možeš da skočiš i malo posle ivice)
  if(!seg){
    p.coy=(p.coy||0)+1;
    if(p.jy<=6&&p.coy>7){G.deathCause='gap';vib([80,50,160]);die();return;}
  }else p.coy=0;

  // Spawn — tematske prepreke (niska/visoka/beba/majka)
  G.obT-=dt;
  if(G.obT<=0){
    const r=Math.random();
    const type=r<0.32?'low':r<0.58?'tall':r<0.78?'baby':'mother';
    G.obs.push({lane:ri(0,3),wz:safeWz(1.0),type,announced:false,bubbleT:0});
    G.obT=raidOn?(1700+rn(0,1000)):(3300+rn(0,3000));
  }
  G.pkT-=dt;if(G.pkT<=0){G.pkp.push({lane:ri(0,3),wz:safeWz(1.0),done:false,drug:DRUGS[ri(0,DRUGS.length)]});G.pkT=3400+rn(0,3800);}

  // MAMINO ZLATO — red novčića (vezano za majku koja ga traži)
  G.coinT-=dt;
  if(G.coinT<=0){
    const gl=ri(0,3),n=3+ri(0,3),z0=safeWz(1.0,(n-1)*0.055);
    for(let i=0;i<n;i++)G.gold.push({lane:gl,wz:z0+i*0.055,done:false});
    G.coinT=6000+rn(0,5000);
    if(!G.goldMsg){G.goldMsg=true;G.msg='🪙 MAMINO ZLATO — pokupi ga!';G.msgT=2400;}
  }

  // Telegraf prepreka — čuju se/najavljuju iz daljine
  for(const o of G.obs){
    if(o.bubbleT>0)o.bubbleT-=dt;
    if(!o.announced&&o.wz<0.6){
      o.announced=true;
      if(o.type==='mother'){sndMother();o.bubbleT=2600;}
      else if(o.type==='baby'){sndBaby();}
    }
  }

  // Collision — prepreke (po tipu)
  for(const o of G.obs){
    if(o.wz>0.14||o.wz<-0.01)continue;
    if(o.lane!==p.lane)continue;
    if(o.type==='mother'){           // previsoka da se preskoči — MORAŠ na drugu traku
      G.crashKind='mother';vib([60,40,120,40,120]);G.deathCause='crash';die();return;
    }
    const need=o.type==='tall'?60:o.type==='baby'?24:30;
    if(p.jy<need*0.5){G.crashKind=o.type;vib([60,40,120]);G.deathCause='crash';die();return;}
    // preskočio si je tik iznad — near-miss bonus
    if(!o.nm){
      o.nm=true;const b=o.type==='tall'?15:10;G.score+=b;
      addPop(W/2,NY-150,'+'+b+' BLIZU!','#7dffb0');
      snd(980,0.07,0.1,'triangle');
    }
  }

  // Collision — zlato
  for(const g of G.gold){
    if(g.done||g.wz>0.12||g.wz<-0.01)continue;
    if(g.lane!==p.lane||p.jy>42)continue;
    g.done=true;G.coins++;G.score+=8;
    const gp=prj(LANES[p.lane],0.06);
    burst(gp.x,NY-30,'#ffd447',8,4);
    addPop(gp.x,NY-90,'+8','#ffd447');
    snd(1320,0.06,0.1,'square');snd(1760,0.09,0.07,'sine');
  }

  // Collision — pickups
  for(const q of G.pkp){
    if(q.done||q.wz>0.14||q.wz<-0.01)continue;
    if(q.lane!==p.lane)continue;
    q.done=true;
    const d=q.drug;
    let dur=d.dur;
    if(ch.bonus===d.id)dur*=2;
    p.eff=d.id;p.effEnd=Date.now()+dur;
    if(d.id==='cocaine')p.mj=2;
    G.suvAlert=true;G.suvAlertT=dur+2000;

    if(d.hard){
      G.streak++;G.lastHard=d.name+' '+d.icon;
      if(G.streak>=3){setTimeout(triggerOD,300);return;}
      G.msg=G.streak===2?`⚠ JOŠ JEDNA ${d.icon} = OVERDOZA!`:`${d.icon} ${d.name} — ${d.msg}`;
    }else{
      G.streak=0;G.msg=`${d.icon} ${d.name} — ${d.msg}`;
    }
    G.msgT=3200;G.shk=10;
    vib(d.hard?(G.streak>=2?[40,30,40,30,80]:[25,20,40]):30);
    const pp=prj(LANES[p.lane],0.1);burst(pp.x,NY-40,d.glo,20,6);

    // Snort/ingest sounds
    const snortIds=['heroin','cocaine','ketamine','speed'];
    if(snortIds.includes(d.id))sndSnort();
    else if(d.id==='crack')sndCrack();
    else if(d.id==='ecstasy')snd(220,0.1,0.15);
    setTimeout(()=>{
      const sfx={
        heroin:()=>snd(80,0.9,0.3),
        acid:()=>{snd(440,0.3,0.2);snd(554,0.45,0.15);},
        cocaine:()=>{snd(900,0.08,0.4,'square');snd(1300,0.12,0.25);},
        speed:()=>snd(650,0.18,0.32,'sawtooth'),
        weed:()=>snd(180,1.2,0.22),
        ketamine:()=>{snd(110,1.4,0.28);snd(82,2.0,0.18);},
        crack:()=>snd(1400,0.18,0.28,'square'),
        ecstasy:()=>{snd(660,0.5,0.18);snd(880,0.7,0.14);},
      };
      if(sfx[d.id])sfx[d.id]();
    },snortIds.includes(d.id)?135:80);
  }
}

  G.ph='dead';
  await saveLB(G.score,G.ch.name,G.deathCause);

  if(G.ph!=='play')return;

  vib([200,80,200,80,400]);

  snd(58,0.35,0.4);
  setTimeout(()=>snd(52,0.45,0.34),550);
  setTimeout(()=>snd(44,0.7,0.26),1200);
  setTimeout(()=>snd(36,1.4,0.16),2100);
  setTimeout(()=>snd(820,4.5,0.055),3400);
}

// ── DRAW HELPERS ─────────────────────────────────
function rr(x,y,w,h,r){
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}
function shade(hex,amt){
  try{
    let r2=parseInt(hex.slice(1,3),16)+amt;
    let g2=parseInt(hex.slice(3,5),16)+amt;
    let b2=parseInt(hex.slice(5,7),16)+amt;
    r2=cl(r2,0,255);g2=cl(g2,0,255);b2=cl(b2,0,255);
    return`#${r2.toString(16).padStart(2,'0')}${g2.toString(16).padStart(2,'0')}${b2.toString(16).padStart(2,'0')}`;
  }catch(e){return hex;}
}

  BG=document.createElement('canvas');BG.width=W;BG.height=H;
  const bx=BG.getContext('2d');
  const sg=bx.createLinearGradient(0,0,0,VY);
  sg.addColorStop(0,'#030310');sg.addColorStop(1,'#080820');
  bx.fillStyle=sg;bx.fillRect(0,0,W,VY);
  bx.fillStyle='rgba(255,255,255,0.8)';
  for(let i=0;i<110;i++)bx.fillRect(Math.random()*W,Math.random()*VY,Math.random()<0.1?2:1,1);
  // mesec sa halo sjajem
  const mh=bx.createRadialGradient(700,40,10,700,40,85);
  mh.addColorStop(0,'rgba(220,215,160,0.28)');mh.addColorStop(0.5,'rgba(200,195,140,0.08)');mh.addColorStop(1,'rgba(200,195,140,0)');
  bx.fillStyle=mh;bx.beginPath();bx.arc(700,40,85,0,PI2);bx.fill();
  bx.fillStyle='#ccc870';bx.beginPath();bx.arc(700,40,18,0,PI2);bx.fill();
  bx.fillStyle='rgba(180,175,120,0.5)';bx.beginPath();bx.arc(694,36,3,0,PI2);bx.arc(704,46,2.2,0,PI2);bx.fill();
  bx.fillStyle='#030310';bx.beginPath();bx.arc(708,35,14,0,PI2);bx.fill();
  // niski oblaci / izmaglica
  bx.fillStyle='rgba(30,32,60,0.5)';
  [[110,55,90,10],[300,38,120,8],[520,62,100,11],[660,80,140,9]].forEach(([cxx,cyy,cw2,ch2])=>{
    bx.beginPath();bx.ellipse(cxx,cyy,cw2,ch2,0,0,PI2);bx.fill();
  });
  const bl=[[0,52],[62,82],[128,60],[195,98],[258,66],[318,86],[378,50],[445,72],[500,56],[558,90],[618,68],[672,54],[728,80],[778,60],[800,70]];
  bx.fillStyle='#07071a';bx.beginPath();bx.moveTo(0,VY);
  for(let i=0;i<bl.length-1;i++){bx.lineTo(bl[i][0],VY-bl[i][1]);bx.lineTo(bl[i+1][0]-1,VY-bl[i][1]);}
  bx.lineTo(W,VY);bx.closePath();bx.fill();
  bx.fillStyle='rgba(255,200,50,0.1)';for(let i=0;i<55;i++)bx.fillRect(Math.random()*W,Math.random()*VY*0.88,3,4);
  return BG;
}

// ── WAGON ────────────────────────────────────────
function drawWagon(w){
  const wz0=w.wz,wz1=w.wz+WLN;
  if(wz1<=0.015||wz0>=1.0)return;
  const wza=Math.max(0.02,wz0),wzb=Math.min(0.98,wz1);
  const pA=prj(WX,wza),pB=prj(WX,wzb);
  const hA=WHT*pA.s,hB=WHT*pB.s;
  const xA=pA.x,yBA=pA.y,yTA=pA.y-hA,xB=pB.x,yBB=pB.y,yTB=pB.y-hB;
  if(xA>W/2-30)return;
  const alp=Math.min(1,(wza-0.015)/0.04)*Math.min(1,(0.98-wzb)/0.04);
  if(alp<=0.01)return;
  cx.globalAlpha=alp;
  function wp(th,tv){
    const x=xA+(xB-xA)*th,yT=yTA+(yTB-yTA)*th,yB=yBA+(yBB-yBA)*th;
    return{x,y:yT+(yB-yT)*tv};
  }
  function quad(c0,c1,c2,c3,sty){
    cx.beginPath();cx.moveTo(c0.x,c0.y);cx.lineTo(c1.x,c1.y);cx.lineTo(c2.x,c2.y);cx.lineTo(c3.x,c3.y);
    cx.closePath();cx.fillStyle=sty;cx.fill();
  }
  function qline(p1,p2,sty,lw){cx.strokeStyle=sty;cx.lineWidth=lw;cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.stroke();}
  const sc=pA.s,tl=wp(0,0),tr=wp(1,0),br=wp(1,1),bl=wp(0,1);
  quad(tl,tr,br,bl,w.col);
  const vg=cx.createLinearGradient(xA,yTA,xA,yBA);
  vg.addColorStop(0,'rgba(255,255,255,0.15)');vg.addColorStop(0.18,'rgba(255,255,255,0.04)');
  vg.addColorStop(0.72,'rgba(0,0,0,0.06)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  quad(tl,tr,br,bl,vg);
  if(sc>0.38){const lH=10*sc,lt2={x:tl.x,y:tl.y-lH},rt2={x:tr.x,y:tr.y-lH*0.6};quad(lt2,rt2,tr,tl,w.colTop);qline(lt2,rt2,'rgba(0,0,0,0.5)',Math.max(0.5,1.5*sc));}
  quad(tl,tr,wp(1,0.04),wp(0,0.04),'rgba(255,255,255,0.14)');
  [0.34,0.67].forEach(tv=>{
    quad(wp(0,tv-0.022),wp(1,tv-0.022),wp(1,tv+0.022),wp(0,tv+0.022),'rgba(0,0,0,0.38)');
    quad(wp(0,tv+0.022),wp(1,tv+0.022),wp(1,tv+0.06),wp(0,tv+0.06),'rgba(0,0,0,0.18)');
    qline(wp(0,tv-0.026),wp(1,tv-0.026),'rgba(255,255,255,0.12)',Math.max(0.5,1.2*sc));
  });
  for(let i=1;i<4;i++){
    const th=i/4;
    qline(wp(th,0.03),wp(th,0.97),'rgba(0,0,0,0.42)',Math.max(0.5,1.8*sc));
    qline({x:wp(th,0.03).x+1.2,y:wp(th,0.03).y},{x:wp(th,0.97).x+1.2,y:wp(th,0.97).y},'rgba(255,255,255,0.07)',Math.max(0.3,0.8*sc));
  }
  if(sc>0.28){
    const dp=Math.min(1,(sc-0.28)/0.18),dl=0.375,dr=0.625,dt=0.09,db=0.91;
    quad(wp(dl,dt),wp(dr,dt),wp(dr,db),wp(dl,db),`rgba(0,0,0,${0.22*dp})`);
    cx.strokeStyle=`rgba(0,0,0,${0.55*dp})`;cx.lineWidth=Math.max(1,2.5*sc);
    cx.beginPath();cx.moveTo(wp(dl,dt).x,wp(dl,dt).y);cx.lineTo(wp(dr,dt).x,wp(dr,dt).y);cx.lineTo(wp(dr,db).x,wp(dr,db).y);cx.lineTo(wp(dl,db).x,wp(dl,db).y);cx.closePath();cx.stroke();
    qline(wp(0.5,dt+0.01),wp(0.5,db-0.01),`rgba(0,0,0,${0.4*dp})`,Math.max(0.5,sc));
  }
  if(sc>0.45){
    const rs=Math.max(1.5,4*sc),op=Math.min(1,(sc-0.45)/0.2);
    [[0,0],[1,0],[0,0.34],[1,0.34],[0,0.67],[1,0.67],[0,1],[1,1],[0.25,0],[0.5,0],[0.75,0],[0.25,1],[0.5,1],[0.75,1]].forEach(([th,tv])=>{
      const pt=wp(th,tv);
      cx.fillStyle=`rgba(150,130,100,${0.7*op})`;cx.beginPath();cx.arc(pt.x,pt.y,rs,0,PI2);cx.fill();
      cx.fillStyle=`rgba(255,255,255,${0.35*op})`;cx.beginPath();cx.arc(pt.x-rs*0.35,pt.y-rs*0.35,rs*0.42,0,PI2);cx.fill();
    });
  }
  if(sc>0.25){
    const na=Math.min(1,(sc-0.25)/0.22),mp=wp(0.5,0.5),fs=Math.max(10,44*sc);
    cx.font=`bold ${fs}px monospace`;cx.textAlign='center';
    cx.fillStyle=`rgba(220,208,185,${0.11*na})`;cx.fillText(w.num,mp.x,mp.y+fs*0.38);cx.textAlign='left';
  }
  w.rust.forEach(rs=>{
    if(sc<0.16)return;const rp=wp(rs.x,rs.y),r2=rs.r*42*sc;if(r2<1.8)return;
    cx.fillStyle=`rgba(108,40,12,${0.25+rs.r*1.6})`;cx.beginPath();cx.ellipse(rp.x,rp.y,r2,r2*0.5,rs.a,0,PI2);cx.fill();

function drawVoid(){
  const fL=prj(-ROOFW,0.996),fR=prj(ROOFW,0.996),nL=prj(-ROOFW,0.004),nR=prj(ROOFW,0.004);
  const g=cx.createLinearGradient(0,fL.y,0,NY+18);
  g.addColorStop(0,'#0b0805');g.addColorStop(1,'#010101');
  cx.fillStyle=g;cx.beginPath();
  cx.moveTo(fL.x,fL.y);cx.lineTo(fR.x,fR.y);cx.lineTo(nR.x,NY+18);cx.lineTo(nL.x,NY+18);cx.closePath();cx.fill();
  // pragovi daleko ispod — jure (daje dubinu ponoru)
  const ts=0.042,to=(G.t*0.00075)%ts;
  for(let wz=to;wz<1;wz+=ts){
    const L=prj(-ROOFW*0.5,wz),R=prj(ROOFW*0.5,wz);
    cx.fillStyle=`rgba(46,26,10,${0.2+L.s*0.34})`;
    cx.fillRect(L.x,L.y+26*L.s,R.x-L.x,Math.max(1,3.4*L.s));
  }
}
function roofEdge(wz){
  if(wz<0.008||wz>0.992)return;
  const L=prj(-ROOFW,wz),R=prj(ROOFW,wz),th=Math.max(2,8*L.s);
  const n=16,dx=(R.x-L.x)/n;
  for(let i=0;i<n;i++){
    cx.fillStyle=i%2?'#14140f':'#e8c020';
    cx.fillRect(L.x+i*dx,L.y-th/2,dx+0.7,th);
  }
  cx.fillStyle=`rgba(0,0,0,${0.32+L.s*0.3})`;
  cx.fillRect(L.x,L.y+th/2,R.x-L.x,Math.max(1,2.4*L.s));
}
function drawRoofSeg(s){
  const z0=s.wz,z1=s.wz+s.len;
  if(z1<=0.005||z0>=0.995)return;
  const a=cl(z0,0.005,0.995),b=cl(z1,0.005,0.995);
  if(b-a<0.004)return;
  const nL=prj(-ROOFW,a),nR=prj(ROOFW,a),fL=prj(-ROOFW,b),fR=prj(ROOFW,b);
  const g=cx.createLinearGradient(0,fL.y,0,nL.y);
  g.addColorStop(0,`hsl(${s.h},${s.sat}%,${Math.max(4,s.lig-6)}%)`);
  g.addColorStop(1,`hsl(${s.h},${s.sat}%,${s.lig+4}%)`);
  cx.fillStyle=g;
  cx.beginPath();cx.moveTo(fL.x,fL.y);cx.lineTo(fR.x,fR.y);cx.lineTo(nR.x,nR.y);cx.lineTo(nL.x,nL.y);cx.closePath();cx.fill();
  // rebra popreko
  for(let i=1;i<8;i++){
    const wz=z0+s.len*(i/8);
    if(wz<0.008||wz>0.992)continue;
    const L=prj(-ROOFW*0.97,wz),R=prj(ROOFW*0.97,wz);
    cx.strokeStyle=`rgba(0,0,0,${0.18+L.s*0.24})`;cx.lineWidth=Math.max(0.6,2.4*L.s);
    cx.beginPath();cx.moveTo(L.x,L.y);cx.lineTo(R.x,R.y);cx.stroke();
    cx.strokeStyle=`rgba(255,255,255,${0.04+L.s*0.06})`;cx.lineWidth=Math.max(0.4,1.1*L.s);
    cx.beginPath();cx.moveTo(L.x,L.y+2*L.s);cx.lineTo(R.x,R.y+2*L.s);cx.stroke();
  }
  // uzdužne linije (staza)
  [-64,64].forEach(rx=>{
    const f=prj(rx,b),n2=prj(rx,a);
    cx.strokeStyle='rgba(255,255,255,0.05)';cx.lineWidth=Math.max(0.5,1.6*n2.s);
    cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(n2.x,n2.y);cx.stroke();
  });
  // rđa
  for(const r of s.rust){
    const wz=z0+s.len*r.v;if(wz<0.01||wz>0.99)continue;
    const p2=prj(r.u*ROOFW,wz),rr2=r.r*ROOFW*p2.s;
    if(rr2<1.2)continue;
    cx.fillStyle=`rgba(116,46,14,${0.2+r.r*3.2})`;
    cx.beginPath();cx.ellipse(p2.x,p2.y,rr2,rr2*0.4,0,0,PI2);cx.fill();
  }
  // broj vagona / grafit
  if(s.grf){
    const wz=z0+s.len*0.5;
    if(wz>0.02&&wz<0.9){
      const p2=prj(0,wz),sc=p2.s;
      if(sc>0.22){
        cx.globalAlpha=Math.min(0.45,sc*0.65);
        cx.fillStyle=`hsl(${s.gh},60%,46%)`;
        cx.font=`bold ${Math.max(8,34*sc)}px 'Courier New'`;cx.textAlign='center';
        cx.fillText(s.num,p2.x,p2.y);cx.textAlign='left';cx.globalAlpha=1;
      }
    }
  }
  // IVICE — odatle se skače
  roofEdge(z0);roofEdge(z1);
}
function drawTrain(){
  drawVoid();
  // procepi — dodatno zatamnjenje da se jasno čitaju kao rupa
  for(const s of G.train){
    const g0=s.wz+s.len,g1=g0+TGAP;
    if(g1<0.006||g0>0.994)continue;
    const a=cl(g0,0.006,0.994),b=cl(g1,0.006,0.994);
    if(b-a<0.002)continue;
    const nL=prj(-ROOFW,a),nR=prj(ROOFW,a),fL=prj(-ROOFW,b),fR=prj(ROOFW,b);
    cx.fillStyle='rgba(0,0,0,0.78)';
    cx.beginPath();cx.moveTo(fL.x,fL.y);cx.lineTo(fR.x,fR.y);cx.lineTo(nR.x,nR.y);cx.lineTo(nL.x,nL.y);cx.closePath();cx.fill();
  }
  [...G.train].sort((a,b)=>b.wz-a.wz).forEach(drawRoofSeg);
  // upozorenje na nadolazeći procep
  for(const s of G.train){
    const gc=s.wz+s.len+TGAP/2;
    if(gc>0.1&&gc<0.52){
      const p2=prj(0,gc),al=cl((0.52-gc)/0.22,0,1);

      cx.globalAlpha=al*0.8;

  }
}

function drawMother(o,px,gy,sc){

  cx.lineTo(x+13*sc,gy-H0*0.72);cx.lineTo(x+15*sc,hipY+4*sc);cx.closePath();cx.fill();
  // ruke na bokovima (ljutito)

  cx.beginPath();cx.moveTo(x-13*sc,gy-H0*0.66);cx.lineTo(x-22*sc,gy-H0*0.5);cx.lineTo(x-14*sc,gy-H0*0.42);cx.stroke();
  cx.beginPath();cx.moveTo(x+13*sc,gy-H0*0.66);cx.lineTo(x+22*sc,gy-H0*0.5);cx.lineTo(x+14*sc,gy-H0*0.42);cx.stroke();

  cx.fillStyle='#cda07a';cx.beginPath();cx.arc(x,hy-6*sc,11*sc,0,PI2);cx.fill();

  cx.fillStyle='#1a0e08';cx.beginPath();cx.arc(x-4*sc,hy-1*sc,1.4*sc,0,PI2);cx.arc(x+4*sc,hy-1*sc,1.4*sc,0,PI2);cx.fill();
  cx.strokeStyle='#1a0e08';cx.beginPath();cx.arc(x,hy+6*sc,3*sc,1.15*Math.PI,1.85*Math.PI);cx.stroke();

  cx.fillStyle='#b83232';

  cx.lineTo(x+10*sc,hy-5*sc);cx.lineTo(x-10*sc,hy-5*sc);cx.closePath();cx.fill();
  // bočni okviri uz lice
  cx.beginPath();cx.moveTo(x-11.5*sc,hy-5*sc);cx.lineTo(x-8*sc,hy+7*sc);cx.lineTo(x-5*sc,hy+5*sc);cx.lineTo(x-9*sc,hy-5*sc);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(x+11.5*sc,hy-5*sc);cx.lineTo(x+8*sc,hy+7*sc);cx.lineTo(x+5*sc,hy+5*sc);cx.lineTo(x+9*sc,hy-5*sc);cx.closePath();cx.fill();
  cx.fillStyle='rgba(255,255,255,0.14)';cx.beginPath();cx.arc(x-4*sc,hy-10*sc,3*sc,0,PI2);cx.fill();
  // govorni balon
  if(o.bubbleT>0&&sc>0.3){
    const a=Math.min(1,o.bubbleT/400);cx.globalAlpha=a;
    const bw=128*sc,bh=30*sc,bx=x-bw/2,byb=hy-30*sc-bh;
    cx.fillStyle='#fff';rr(bx,byb,bw,bh,6*sc);cx.fill();
    cx.beginPath();cx.moveTo(x-6*sc,byb+bh);cx.lineTo(x+6*sc,byb+bh);cx.lineTo(x,byb+bh+9*sc);cx.closePath();cx.fill();
    cx.fillStyle='#a01818';cx.font=`bold ${Math.max(8,11*sc)}px 'Courier New'`;cx.textAlign='center';
    cx.fillText('GDE JE MOJE',x,byb+bh*0.42);cx.fillText('ZLATO?!',x,byb+bh*0.82);
    cx.globalAlpha=1;

}
function drawObs(o){
  if(o.wz>0.985)return;
  const p=prj(LANES[o.lane],o.wz),sc=p.s,px=p.x,gy=p.y;

// ── GOLD (mamino zlato) ──────────────────────────

  const fy=Math.sin(G.t/240+g.wz*40)*3*sc,cy=p.y-16*sc+fy,R=Math.max(3.5,10*sc);

  cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.ellipse(p.x,p.y,R*0.9,2.6*sc,0,0,PI2);cx.fill();

  cx.fillStyle=gg;cx.beginPath();cx.arc(p.x,cy,R*2.2,0,PI2);cx.fill();
  cx.fillStyle='#c98f10';cx.beginPath();cx.ellipse(p.x,cy,rw,R,0,0,PI2);cx.fill();
  cx.fillStyle='#ffd447';cx.beginPath();cx.ellipse(p.x,cy,rw*0.78,R*0.78,0,0,PI2);cx.fill();

// ── PICKUPS ──────────────────────────────────────
function drawPickup(q){
  if(q.done||q.wz>0.99)return;
  const p=prj(LANES[q.lane],q.wz),sc=p.s,d=q.drug;
  const fy=Math.sin(G.t/360+q.lane*2.1)*8*sc,px=p.x,py=p.y-58*sc+fy,R=Math.max(8,42*sc);
  // TELEGRAF: marker na tlu + svetlosni stub — vidljivo iz daljine
  const mr=Math.max(6,26*sc),mp=0.6+Math.sin(G.t/220+q.lane)*0.4;
  const mg=cx.createRadialGradient(px,p.y,0,px,p.y,mr*1.6);
  mg.addColorStop(0,d.glo+'aa');mg.addColorStop(1,d.glo+'00');
  cx.fillStyle=mg;cx.beginPath();cx.ellipse(px,p.y,mr*1.4,mr*0.5,0,0,PI2);cx.fill();
  cx.strokeStyle=d.glo+'cc';cx.lineWidth=Math.max(1,2*sc);
  cx.beginPath();cx.ellipse(px,p.y,mr*mp,mr*0.38*mp,0,0,PI2);cx.stroke();
  const bg=cx.createLinearGradient(px,p.y,px,py);
  bg.addColorStop(0,d.glo+'55');bg.addColorStop(1,d.glo+'00');
  cx.fillStyle=bg;cx.fillRect(px-Math.max(2,5*sc),py,Math.max(4,10*sc),p.y-py);
  const gl=cx.createRadialGradient(px,py,0,px,py,R*2.8);
  gl.addColorStop(0,d.glo+'cc');gl.addColorStop(1,d.glo+'00');
  cx.fillStyle=gl;cx.fillRect(px-R*3,py-R*3,R*6,R*6);
  cx.fillStyle='rgba(0,0,0,0.78)';cx.beginPath();cx.arc(px,py,R,0,PI2);cx.fill();
  const pulse=0.84+Math.sin(G.t/260+q.lane)*0.16;
  cx.strokeStyle=d.glo;cx.lineWidth=Math.max(2,5*sc)*pulse;
  cx.shadowColor=d.glo;cx.shadowBlur=22*sc;cx.beginPath();cx.arc(px,py,R,0,PI2);cx.stroke();cx.shadowBlur=0;
  cx.strokeStyle=d.glo+'44';cx.lineWidth=Math.max(1,2*sc);cx.beginPath();cx.arc(px,py,R*1.45,0,PI2);cx.stroke();
  // Urgent XANAX pulse
  if(q.urgent){
    cx.strokeStyle='#00ccff';cx.lineWidth=Math.max(2,3*sc)*(0.7+Math.sin(G.t/100)*0.3);
    cx.beginPath();cx.arc(px,py,R*1.8,0,PI2);cx.stroke();
  }
  cx.font=`${Math.max(15,30*sc)}px serif`;cx.textAlign='center';cx.fillText(d.icon,px,py+10*sc);
  if(sc>0.18){
    const a=Math.min(1,(sc-0.18)/0.28);cx.globalAlpha=a;
    const lW=Math.max(60,100*sc),lH=Math.max(16,22*sc);
    cx.fillStyle=d.col+'ee';rr(px-lW/2,py+R+5*sc,lW,lH,4*sc);cx.fill();
    cx.fillStyle='#fff';cx.font=`bold ${Math.max(8,12*sc)}px 'Courier New'`;cx.textAlign='center';cx.fillText(d.name,px,py+R+lH*0.74+5*sc);
    if(sc>0.45){
      const a2=Math.min(1,(sc-0.45)/0.28);cx.globalAlpha=a*a2;
      const dW=Math.max(95,155*sc),dH=Math.max(12,17*sc);
      cx.fillStyle='rgba(0,0,0,0.68)';rr(px-dW/2,py+R+lH+8*sc,dW,dH,3*sc);cx.fill();
      cx.fillStyle=d.glo;cx.font=`${Math.max(6,9*sc)}px 'Courier New'`;cx.fillText(d.msg,px,py+R+lH+dH*0.76+8*sc);
    }
    cx.globalAlpha=1;
  }

// ── PLAYER ───────────────────────────────────────
function drawPlayer(){
  const p=G.p,ch=G.ch;
  const plX=W/2+(p.wx-LANES[1])*0.44,jO=p.jy*2.8,bY=NY-jO;
  const ls=p.gnd?Math.sin(G.t/155)*14:0;
  // Shadow
  const ss=Math.max(0.3,1-p.jy*0.018);
  cx.fillStyle=`rgba(0,0,0,${0.45*ss})`;cx.beginPath();cx.ellipse(plX,NY+4,28*ss,9*ss,0,0,PI2);cx.fill();
  // Naginjanje u promeni trake + squash na doskoku
  const lean=cl((LANES[p.lane]-p.wx)*0.0024,-0.16,0.16);
  const sq=p.landT>0?1-0.07*Math.sin((p.landT/170)*Math.PI):1;
  cx.save();cx.translate(plX,bY);cx.rotate(lean);cx.scale(2-sq,sq);cx.translate(-plX,-bY);
  // Shoes + animirane noge — run cycle sa savijanjem kolena
  const shoeCol='#e8e6e0',soleCol='#1a1a1a';
  const stride=p.gnd?Math.sin(G.t/130):0;
  function drawShoe(ox,oy,flip){
    const f=flip?-1:1;
    cx.fillStyle=shoeCol;cx.beginPath();
    cx.moveTo(ox-9*f,oy);cx.bezierCurveTo(ox-11*f,oy+3,ox-11*f,oy+8,ox-6*f,oy+10);
    cx.lineTo(ox+12*f,oy+10);cx.bezierCurveTo(ox+15*f,oy+8,ox+15*f,oy+3,ox+12*f,oy);cx.closePath();cx.fill();
    cx.fillStyle=soleCol;cx.fillRect(ox-9*f,oy+9,21,5);
  }
  // prašina iza stopala dok trči
  if(p.gnd){const d=Math.abs(stride);cx.fillStyle=`rgba(125,105,85,${0.16*d})`;
    cx.beginPath();cx.ellipse(plX-stride*16,bY+3,9*d+3,4,0,0,PI2);cx.fill();}
  function drawRunLeg(side){
    const air=!p.gnd;
    // u vazduhu: tuck poza — prednje koleno gore, zadnja noga savijena
    const ph=air?(side<0?0.8:-0.35):(side<0?stride:-stride);
    const hipX=plX+side*8,hipY=bY-30;
    const lift=Math.max(0,ph)*11+(air?9:0);
    const kneeX=hipX+side*2+ph*5,kneeY=hipY+14-lift*0.35;
    const footX=hipX+ph*10,footY=bY-lift;
    const lg=cx.createLinearGradient(hipX-7,0,hipX+7,0);
    lg.addColorStop(0,'#142a54');lg.addColorStop(0.5,'#1e3a72');lg.addColorStop(1,'#0e2046');
    cx.strokeStyle=lg;cx.lineWidth=12;cx.lineCap='round';cx.lineJoin='round';
    cx.beginPath();cx.moveTo(hipX,hipY);cx.lineTo(kneeX,kneeY);cx.lineTo(footX,footY);cx.stroke();
    cx.lineCap='butt';
    drawShoe(footX,footY-2,side>0);
  }
  // noga u zamahu (podignuta) ide iza planuće
  if(stride>0){drawRunLeg(-1);drawRunLeg(1);}else{drawRunLeg(1);drawRunLeg(-1);}
  // Jacket colour based on effect
  const effJC={heroin:'#2a0505',acid:`hsl(${G.hue},40%,15%)`,cocaine:'#08122a',
    speed:'#1e0a02',weed:'#061408',ketamine:'#030e14',crack:'#1a0800',ecstasy:'#1a0016'};
  const jCol=effJC[p.eff]||ch.jc;
  // Arms
  function drawArm(side,swing){
    const ax=plX+side*25;
    const ag=cx.createLinearGradient(ax-6,0,ax+6,0);
    ag.addColorStop(0,side<0?shade(jCol,5):shade(jCol,-15));
    ag.addColorStop(1,side<0?shade(jCol,-15):shade(jCol,5));
    cx.fillStyle=ag;cx.beginPath();
    cx.moveTo(ax-5,bY-70);cx.bezierCurveTo(ax-6,bY-55,ax-5+swing*0.3,bY-40,ax-4,bY-34+swing);
    cx.lineTo(ax+5,bY-34+swing);cx.bezierCurveTo(ax+6,bY-40,ax+7,bY-55,ax+6,bY-70);cx.closePath();cx.fill();
    // Hand
    cx.fillStyle=ch.skin;cx.beginPath();cx.ellipse(ax,bY-28+swing,4.5,5.5,swing*0.05,0,PI2);cx.fill();
  }
  drawArm(-1,ls*0.55);drawArm(1,-ls*0.55);
  // Body
  const jg=cx.createLinearGradient(plX-26,0,plX+26,0);
  jg.addColorStop(0,shade(jCol,-15));jg.addColorStop(0.38,shade(jCol,20));jg.addColorStop(0.62,shade(jCol,18));jg.addColorStop(1,shade(jCol,-20));
  cx.fillStyle=jg;cx.beginPath();
  cx.moveTo(plX-26,bY-70);cx.bezierCurveTo(plX-28,bY-55,plX-21,bY-40,plX-20,bY-24);
  cx.lineTo(plX+20,bY-24);cx.bezierCurveTo(plX+21,bY-40,plX+28,bY-55,plX+26,bY-70);
  cx.bezierCurveTo(plX+16,bY-72,plX-16,bY-72,plX-26,bY-70);cx.closePath();cx.fill();
  // Back seam
  cx.strokeStyle='rgba(0,0,0,0.28)';cx.lineWidth=1;cx.beginPath();cx.moveTo(plX,bY-70);cx.lineTo(plX,bY-24);cx.stroke();
  // Kabir stripes
  if(ch.id==='kabir'){
    cx.strokeStyle='rgba(255,255,255,0.22)';cx.lineWidth=3;
    [0.3,0.6].forEach(t=>{const fy=bY-70+(70-24)*t,fw=26-t*6;cx.beginPath();cx.moveTo(plX-fw,fy);cx.lineTo(plX+fw,fy);cx.stroke();});
  }
  // Sara glitter hint
  if(ch.id==='sara'){
    cx.fillStyle='rgba(255,180,220,0.3)';
    for(let i=0;i<5;i++)cx.fillRect(plX-20+i*8,bY-60+i*5,2,2);
  }
  // Neck
  const ng=cx.createLinearGradient(plX-5,0,plX+5,0);
  ng.addColorStop(0,shade(ch.skin,-20));ng.addColorStop(0.5,ch.skin);ng.addColorStop(1,shade(ch.skin,-20));
  cx.fillStyle=ng;cx.beginPath();
  cx.moveTo(plX-5,bY-80);cx.bezierCurveTo(plX-6,bY-76,plX-5,bY-71,plX-4,bY-69);
  cx.lineTo(plX+4,bY-69);cx.bezierCurveTo(plX+5,bY-71,plX+6,bY-76,plX+5,bY-80);cx.closePath();cx.fill();
  // Head
  const hg=cx.createRadialGradient(plX-3,bY-94,2,plX,bY-92,16);
  hg.addColorStop(0,shade(ch.skin,18));hg.addColorStop(0.6,ch.skin);hg.addColorStop(1,shade(ch.skin,-22));
  cx.fillStyle=hg;cx.beginPath();
  cx.moveTo(plX-8,bY-78);cx.bezierCurveTo(plX-16,bY-80,plX-17,bY-96,plX-13,bY-104);
  cx.bezierCurveTo(plX-10,bY-110,plX-5,bY-113,plX,bY-113);
  cx.bezierCurveTo(plX+5,bY-113,plX+10,bY-110,plX+13,bY-104);
  cx.bezierCurveTo(plX+17,bY-96,plX+16,bY-80,plX+8,bY-78);cx.closePath();cx.fill();
  // Ears
  cx.fillStyle=shade(ch.skin,-18);
  cx.beginPath();cx.ellipse(plX-15,bY-91,3,4.5,0.2,0,PI2);cx.fill();
  cx.beginPath();cx.ellipse(plX+15,bY-91,3,4.5,-0.2,0,PI2);cx.fill();
  // Hair
  drawHair(plX,bY,ch);
  // Drug aura
  if(p.eff){
    const d=DRUGS.find(d=>d.id===p.eff);
    const aura=cx.createRadialGradient(plX,bY-55,5,plX,bY-55,55);
    aura.addColorStop(0,'rgba(0,0,0,0)');aura.addColorStop(0.6,d.glo+'18');aura.addColorStop(1,d.glo+'00');
    cx.globalAlpha=0.7+Math.sin(G.t/220)*0.3;cx.fillStyle=aura;
    cx.beginPath();cx.ellipse(plX,bY-55,45,70,0,0,PI2);cx.fill();cx.globalAlpha=1;
  }
  // Sweat from anxiety
  if(G.anxiety>62&&p.gnd){
    const sw=(G.anxiety-62)/38;
    cx.fillStyle=`rgba(160,210,255,${sw*0.85})`;
    [[-14,-78],[16,-82],[-19,-88]].forEach(([dx,dy])=>{cx.beginPath();cx.arc(plX+dx,bY+dy,sw*2.2,0,PI2);cx.fill();});
  }
  cx.restore();
}

function drawHair(plX,bY,ch){
  const hBase=ch.hCol,hLight=shade(hBase,28),hDark=shade(hBase,-14);
  if(ch.hair==='slick'){
    const hg=cx.createLinearGradient(plX-14,bY-115,plX+14,bY-110);
    hg.addColorStop(0,hDark);hg.addColorStop(0.4,hLight);hg.addColorStop(1,hDark);
    cx.fillStyle=hg;cx.beginPath();
    cx.moveTo(plX-13,bY-104);cx.bezierCurveTo(plX-14,bY-112,plX-8,bY-116,plX,bY-115);
    cx.bezierCurveTo(plX+8,bY-116,plX+14,bY-112,plX+13,bY-104);
    cx.bezierCurveTo(plX+10,bY-106,plX-10,bY-106,plX-13,bY-104);cx.closePath();cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.18)';cx.lineWidth=2;
    cx.beginPath();cx.moveTo(plX-4,bY-113);cx.bezierCurveTo(plX,bY-115,plX+6,bY-114,plX+8,bY-111);cx.stroke();

// ── DRUG FX ──────────────────────────────────────
function drawFX(){
  // brzinske linije kad juriš — osećaj brzine (nezavisno od droge)
  const v=G.curSp||0.008;
  if(v>0.0115){
    const k=Math.min(1,(v-0.0115)/0.012);
    cx.strokeStyle=`rgba(255,255,255,${0.05+k*0.07})`;
    for(let i=0;i<Math.floor(4+k*10);i++){
      const sy=20+rn(0,H-40);cx.lineWidth=0.5+rn(0,1.5);
      const ln=40+rn(0,150)*k;
      cx.beginPath();cx.moveTo(sy%2?rn(0,90):W-rn(0,90),sy);cx.lineTo(sy%2?rn(0,90)+ln:W-rn(0,90)-ln,sy);cx.stroke();
    }
  }
  const e=G.p.eff;if(!e)return;
  if(e==='heroin'){
    const vg=cx.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,H*0.9);
    vg.addColorStop(0,'rgba(50,15,0,0)');vg.addColorStop(1,'rgba(60,18,0,0.8)');
    cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  }
  if(e==='acid'){
    for(let y=0;y<H;y+=40){
      cx.strokeStyle=`hsla(${(G.hue+y*1.4)%360},82%,62%,0.065)`;cx.lineWidth=28;
      cx.beginPath();cx.moveTo(0,y);for(let x=0;x<=W;x+=7)cx.lineTo(x,y+Math.sin(x/22+G.t/280)*8);cx.stroke();
    }
    cx.fillStyle=`rgba(140,0,210,${0.05+Math.sin(G.t/450)*0.04})`;cx.fillRect(0,0,W,H);
  }
  if(e==='cocaine'){
    if(G.fr%48<5){cx.fillStyle=`rgba(255,255,255,${0.14*(5-G.fr%48)/5})`;cx.fillRect(0,0,W,H);}
    const vg=cx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
    vg.addColorStop(0,'rgba(130,180,255,0)');vg.addColorStop(1,'rgba(130,180,255,0.1)');
    cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  }
  if(e==='speed'||e==='crack'){
    cx.strokeStyle=e==='crack'?'rgba(255,80,0,0.12)':'rgba(255,120,20,0.1)';
    for(let i=0;i<14;i++){
      const sy=30+rn(0,H-60);cx.lineWidth=1+rn(0,2.5);
      cx.beginPath();cx.moveTo(0,sy);cx.lineTo(60+rn(0,200),sy);cx.stroke();
    }
  }
  if(e==='weed'){cx.fillStyle='rgba(7,40,7,0.2)';cx.fillRect(0,0,W,H);}
  if(e==='ketamine'){
    const vg=cx.createRadialGradient(W/2,H*0.52,H*0.1,W/2,H*0.52,H*0.78);
    vg.addColorStop(0,'rgba(0,140,165,0)');vg.addColorStop(0.55,'rgba(0,5,20,0.1)');vg.addColorStop(1,'rgba(0,0,25,0.9)');
    cx.fillStyle=vg;cx.fillRect(0,0,W,H);
    cx.strokeStyle='rgba(0,200,225,0.04)';cx.lineWidth=20;
    for(let y=0;y<H;y+=52){cx.beginPath();cx.moveTo(0,y);for(let x=0;x<=W;x+=8)cx.lineTo(x,y+Math.sin(x/35+G.t/500)*4);cx.stroke();}
  }
  if(e==='ecstasy'){
    const a=0.06+Math.sin(G.t/300)*0.04;
    cx.fillStyle=`rgba(200,0,100,${a})`;cx.fillRect(0,0,W,H);
    if(G.fr%60<8){cx.fillStyle=`rgba(255,100,200,${0.1*(8-G.fr%60)/8})`;cx.fillRect(0,0,W,H);}
  }
}

// ── ANXIETY FX ───────────────────────────────────
function drawAnxiety(){
  const pct=G.anxiety/100;if(pct<0.45)return;

}

// ── OVERDOSE ─────────────────────────────────────
function drawOverdose(){
  const t=G.ovT,prog=Math.min(1,t/5600);
  const hbP=Math.max(250,700-prog*600),beat=prog<0.65?Math.pow(Math.max(0,Math.sin((t%hbP)/hbP*PI2)),18)*0.48:0;
  const vr=cx.createRadialGradient(W/2,H/2,H*(0.3-prog*0.26),W/2,H/2,H*0.92);
  vr.addColorStop(0,'rgba(0,0,0,0)');vr.addColorStop(1,`rgba(110,0,0,${0.3+prog*0.65+beat*0.28})`);
  cx.fillStyle=vr;cx.fillRect(0,0,W,H);
  if(beat>0.08){cx.fillStyle=`rgba(255,255,255,${beat*0.2})`;cx.fillRect(0,0,W,H);}
  if(t>350&&t<4000){
    cx.save();cx.globalAlpha=Math.min(1,(t-350)/300)*0.88;cx.strokeStyle='#22dd44';cx.lineWidth=2;
    const lx=55,ly=H*0.77,lw=W-110;cx.beginPath();cx.moveTo(lx,ly);
    const nb=Math.min(5,Math.floor((t-350)/620));let cx2=lx;
    for(let i=0;i<nb;i++){const seg=lw/6;cx.lineTo(cx2+seg*0.24,ly);cx.lineTo(cx2+seg*0.31,ly-38);cx.lineTo(cx2+seg*0.38,ly+22);cx.lineTo(cx2+seg*0.44,ly);cx2+=seg;}
    if(t>2900){cx.lineTo(lx+lw,ly);}else{cx.lineTo(cx2,ly);}cx.stroke();
    if(t>2900){cx.fillStyle='#22dd44';cx.font='10px Courier New';cx.textAlign='right';cx.fillText('FLATLINE ──────',W-58,H*0.77-10);cx.textAlign='left';}
    cx.restore();
  }
  if(t>500){
    const ta=Math.min(1,(t-500)/550);cx.globalAlpha=ta;cx.textAlign='center';
    cx.shadowColor='#ff0000';cx.shadowBlur=55;cx.fillStyle='#fff';
    cx.font=`bold ${Math.min(68,38+prog*32)}px Courier New`;cx.fillText('OVERDOZA',W/2,H*0.22);cx.shadowBlur=0;cx.globalAlpha=1;
  }
  if(t>950&&G.lastHard){
    cx.globalAlpha=Math.min(1,(t-950)/420);cx.textAlign='center';
    cx.fillStyle='#ff9999';cx.font='14px Courier New';cx.fillText(`${G.ch.emoji} ${G.ch.name} — ${G.lastHard} × 3 zaredom`,W/2,H*0.32);cx.globalAlpha=1;
  }
  const info=[
    {at:1400,txt:'⚠  HEROIN i KETAMIN usporavaju disanje i zaustavljaju srce',c:'#ffaaaa'},
    {at:2000,txt:'Predoziranje — smrt nastupa za nekoliko minuta bez pomoći',c:'#ffcc99'},
    {at:2600,txt:'📞  ODMAH ZOVI 112 — ne čekaj, svaka sekunda je važna',c:'#ffff88'},
    {at:3200,txt:'💊  Nalokson (Narcan) poništava efekte opijata i spašava živote',c:'#aaffcc'},
    {at:3900,txt:'Postavi osobu u bočni položaj — sprečava gušenje',c:'#aaccff'},
  ];
  info.forEach((inf,i)=>{
    if(t<inf.at)return;
    const ia=Math.min(1,(t-inf.at)/450)*0.92;cx.globalAlpha=ia;
    const iy=H*0.42+i*32;cx.fillStyle='rgba(0,0,0,0.58)';cx.fillRect(W*0.04,iy-16,W*0.92,24);
    cx.fillStyle=inf.c;cx.font='12px Courier New';cx.textAlign='center';cx.fillText(inf.txt,W/2,iy);cx.globalAlpha=1;
  });
  if(prog>0.9){cx.fillStyle=`rgba(0,0,0,${(prog-0.9)/0.1})`;cx.fillRect(0,0,W,H);}
  cx.textAlign='left';
}

// ── HUD ──────────────────────────────────────────

  // Leteći score popup-i
  for(const pp of G.pops){

    cx.fillStyle=pp.col;cx.shadowColor='#000';cx.shadowBlur=5;cx.fillText(pp.txt,pp.x,pp.y);cx.shadowBlur=0;
  }

  cx.fillStyle='#333';cx.font='8px Courier New';cx.textAlign='right';cx.fillText('😰 ANKSIOZNOST',W-14,bY2-3);
  // Streak
  if(G.streak>0){
    cx.font='14px serif';cx.textAlign='right';cx.fillText('💉'.repeat(G.streak),W-14,80);

  }
  // Drug bar
  if(p.eff){
    const d=DRUGS.find(d=>d.id===p.eff),rem=Math.max(0,p.effEnd-Date.now()),frac=rem/d.dur;
    cx.fillStyle='rgba(0,0,0,0.7)';rr(10,10,218,58,8);cx.fill();
    cx.fillStyle=d.col+'cc';rr(12,36,214*frac,17,4);cx.fill();
    cx.fillStyle='#fff';cx.font='bold 14px Courier New';cx.textAlign='left';cx.fillText(`${d.icon}  ${d.name}`,16,30);
    cx.fillStyle=d.glo;cx.font='9px Courier New';cx.fillText(d.msg,16,52);
    if(rem<2000&&G.fr%18<9){cx.fillStyle='rgba(255,30,30,0.25)';rr(10,10,218,58,8);cx.fill();}
  }
  // Lane dots
  [0,1,2].forEach(i=>{
    cx.fillStyle=i===p.lane?'#fff':'#2a2a2a';cx.beginPath();cx.arc(W/2+(i-1)*28,H-14,i===p.lane?5:3.5,0,PI2);cx.fill();
  });
  // Char indicator
  cx.textAlign='left';cx.fillStyle='#2a2a2a';cx.font='10px Courier New';cx.fillText(`${ch.emoji} ${ch.name}`,14,H-10);
  // Hint
  if(G.score<10){cx.fillStyle='rgba(255,255,255,0.2)';cx.font='10px Courier New';cx.textAlign='center';cx.fillText('← → traka   SPACE skok',W/2,H-24);}
  // Message
  if(G.msgT>0&&G.ph==='play'){
    cx.globalAlpha=Math.min(1,G.msgT/500);cx.font='bold 22px Courier New';cx.textAlign='center';
    cx.fillStyle=G.streak===2?'#ff6666':'#fff';cx.shadowColor='#000';cx.shadowBlur=18;cx.fillText(G.msg,W/2,H*0.33);cx.shadowBlur=0;cx.globalAlpha=1;
  }
  cx.textAlign='left';
}

  if(dc==='anxiety')cx.fillStyle='#ffaa77',cx.font='11px Courier New',cx.fillText(`${G.ch.emoji} ${G.ch.name} nije mogao da podnese anksioznost bez droge`,W/2,H*0.2);
  if(G.wasOD)cx.fillStyle='#ffaaaa',cx.font='11px Courier New',cx.fillText('Heroin/Ketamin/Krek blokira disanje — pozovi 112 · Nalokson spašava živote',W/2,H*0.2);
  cx.fillStyle='#f1c40f';cx.font='bold 14px Courier New';cx.fillText(`${G.ch.emoji}  ${G.ch.name}  —  ${Math.floor(G.score)} bodova  ·  🚃 ${G.wagons}${G.coins?`  ·  🪙 ${G.coins}`:''}`,W/2,H*0.27);
  // Leaderboard
  if(LB.length>0){
    cx.fillStyle='#111';rr(W/2-210,H*0.32,420,H*0.54,6);cx.fill();cx.strokeStyle='#222';cx.lineWidth=1;rr(W/2-210,H*0.32,420,H*0.54,6);cx.stroke();
    cx.fillStyle='#2a2a2a';cx.font='bold 9px Courier New';cx.fillText('── TOP 10 ──',W/2,H*0.32+16);
    const medals=['🥇','🥈','🥉'];
    const causeIco={crash:'🚧',overdoza:'💉',anxiety:'😰',gap:'🚃'};
    LB.forEach((e,i)=>{
      const ry=H*0.32+30+i*22;
      const isMe=e.score===Math.floor(G.score)&&e.char===G.ch.name;
      if(isMe){cx.fillStyle='rgba(241,196,15,0.08)';cx.fillRect(W/2-208,ry-13,416,20);}
      cx.fillStyle=isMe?'#f1c40f':i<3?'#fff':i<6?'#888':'#444';
      cx.font=`${isMe?'bold ':''} 11px Courier New`;
      cx.fillText(`${medals[i]||`${i+1}.`}  ${e.char}  ${e.score}  ${causeIco[e.cause]||''}  ${e.d||''}`,W/2,ry);
    });
  }
  if(Math.floor(G.t/600)%2===0){cx.fillStyle='#444';cx.font='11px Courier New';cx.fillText('[ SPACE / TAP — nazad na odabir ]',W/2,H*0.92);}
  cx.textAlign='left';
}

// ── ORIENTATION ──────────────────────────────────
function drawOrientation(){
  cx.fillStyle='#05050a';cx.fillRect(0,0,W,H);
  const angle=Math.sin(G.t/600)*0.35;
  cx.save();cx.translate(W/2,H*0.38);cx.rotate(angle);
  cx.fillStyle='#1a1a2a';cx.strokeStyle='#c0392b';cx.lineWidth=3;rr(-22,-38,44,72,8);cx.fill();rr(-22,-38,44,72,8);cx.stroke();
  cx.fillStyle='#c0392b';cx.fillRect(-14,-30,28,42);cx.fillStyle='#0a0a14';cx.beginPath();cx.arc(0,26,4,0,PI2);cx.fill();
  cx.restore();
  cx.strokeStyle='rgba(192,57,43,0.5)';cx.lineWidth=2.5;cx.setLineDash([6,5]);
  cx.beginPath();cx.arc(W/2,H*0.38,52,Math.PI*0.2,Math.PI*1.85);cx.stroke();cx.setLineDash([]);
  cx.fillStyle='#c0392b';const ax=W/2+52*Math.cos(Math.PI*1.85),ay=H*0.38+52*Math.sin(Math.PI*1.85);
  cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(ax-8,ay-4);cx.lineTo(ax-4,ay+8);cx.closePath();cx.fill();
  cx.textAlign='center';
  cx.fillStyle='#fff';cx.font='bold 20px Courier New';cx.shadowColor='#c0392b';cx.shadowBlur=12;cx.fillText('ROTAJ TELEFON',W/2,H*0.64);cx.shadowBlur=0;
  cx.fillStyle='#444';cx.font='12px Courier New';cx.fillText('Igra radi u landscape modu',W/2,H*0.74);
  cx.textAlign='left';
}

// ── RENDER ───────────────────────────────────────
function render(){
  cx.clearRect(0,0,W,H);
  if(isPortrait){drawOrientation();return;}
  if(G.ph==='charselect'){drawCharSelect();return;}
  cx.save();
  if(G.shk>0)cx.translate(rn(-G.shk,G.shk),rn(-G.shk*0.5,G.shk*0.5));
  if(G.p&&G.p.eff==='acid')cx.filter=`hue-rotate(${G.hue}deg) saturate(2.5) brightness(1.06)`;
  drawScene();
  if(!(G.raid&&G.raid.active))drawSUV();
  [...G.obs.map(o=>({...o,_:'o'})),...G.pkp.filter(q=>!q.done).map(q=>({...q,_:'p'})),
   ...(G.gold||[]).filter(g=>!g.done).map(g=>({...g,_:'g'}))]
    .sort((a,b)=>b.wz-a.wz).forEach(obj=>obj._==='o'?drawObs(obj):obj._==='p'?drawPickup(obj):drawGold(obj));
  drawPoliceChase();
  drawPlayer();drawFX();drawAnxiety();
  for(const pt of G.parts){cx.globalAlpha=Math.max(0,pt.l);cx.fillStyle=pt.col;cx.beginPath();cx.arc(pt.x,pt.y,pt.r,0,PI2);cx.fill();}
  cx.globalAlpha=1;cx.filter='none';cx.restore();
  if(G.ph==='play'){drawHUD();drawRaidHUD();drawMomCall();if(G.paused)drawPause();}
  if(G.ph==='overdose'){drawOverdose();drawHUD();}
  if(G.ph==='dead')drawDead();
}

// ── PAUSE ────────────────────────────────────────
let pauseStart=0;
function togglePause(){
  if(G.ph!=='play')return;
  G.paused=!G.paused;
  if(G.paused){pauseStart=Date.now();snd(330,0.08,0.1);}
  else{
    // Realno vreme je teklo tokom pauze — pomeri Date.now() tajmere droge
    const dp=Date.now()-pauseStart;if(G.p.effEnd)G.p.effEnd+=dp;
    snd(440,0.08,0.1);
  }
  syncUI();
}
function drawPause(){
  cx.fillStyle='rgba(0,0,0,0.72)';cx.fillRect(0,0,W,H);
  cx.textAlign='center';
  cx.fillStyle='#f1c40f';cx.font='bold 40px Courier New';
  cx.shadowColor='#000';cx.shadowBlur=16;cx.fillText('⏸ PAUZA',W/2,H*0.44);cx.shadowBlur=0;
  cx.fillStyle='#888';cx.font='13px Courier New';
  cx.fillText('Tapni ekran ili pritisni P za nastavak',W/2,H*0.55);
  cx.fillStyle='#444';cx.font='11px Courier New';
  cx.fillText(`${G.ch.emoji} ${G.ch.name}  ·  ${Math.floor(G.score)} bodova`,W/2,H*0.62);
  cx.textAlign='left';
}

// ── UI SYNC (DOM dugmad) ─────────────────────────
const elMute=document.getElementById('bMute');
const elPause=document.getElementById('bPause');
const elShare=document.getElementById('bShare');
function syncUI(){
  elMute.textContent=MUTED?'🔇':'🔊';
  elPause.textContent=G.paused?'▶':'⏸';
  elPause.classList.toggle('hidden',G.ph!=='play');
  elShare.style.display=G.ph==='dead'?'block':'none';
}
elMute.addEventListener('click',()=>{toggleMute();syncUI();});
elPause.addEventListener('click',()=>togglePause());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.ph==='play'&&!G.paused)togglePause();});

// ── SHAREABLE DEATH CARD (Canvas → PNG) ──────────
const CARD_FACTS={
  gap:'Jedan pogrešan korak i nema nazad. Zavisnost isto tako — procep se ne vidi dok ne upadneš.',
  crash:'Zavisnost te ne uhvati odjednom — nego korak po korak, dok ne pomisliš da kontrolišeš situaciju.',
  overdoza:'Opijati (heroin, fentanil) zaustavljaju disanje. Nalokson (Narcan) poništava predoziranje — pozovi 112.',
  anxiety:'Droga ne leči anksioznost — odlaže je i pojačava. Pravo olakšanje je razgovor i pomoć, ne sledeća doza.',
};
function buildCard(){
  const cw=720,chh=900,cc=document.createElement('canvas');cc.width=cw;cc.height=chh;
  const x=cc.getContext('2d');
  const titles={crash:'UHVAĆEN',overdoza:'OVERDOZA',anxiety:'NAPADAJ PANIKE',gap:'PAO IZMEĐU VAGONA'};
  const colors={crash:'#e74c3c',overdoza:'#ff2222',anxiety:'#ff8c00',gap:'#c0392b'};
  const dc=G.deathCause,col=colors[dc]||'#e74c3c';
  // BG
  const bg=x.createLinearGradient(0,0,0,chh);bg.addColorStop(0,'#0a0a0a');bg.addColorStop(1,'#160606');
  x.fillStyle=bg;x.fillRect(0,0,cw,chh);
  x.strokeStyle=col;x.lineWidth=6;x.strokeRect(18,18,cw-36,chh-36);
  x.textAlign='center';
  // Brand
  x.fillStyle='#c0392b';x.font='bold 30px Courier New';x.fillText('TRAINSPOTTING RUNNER',cw/2,82);
  // Cause
  x.fillStyle=col;x.font='bold 74px Courier New';x.shadowColor=col;x.shadowBlur=30;
  x.fillText(titles[dc]||'UHVAĆEN',cw/2,200);x.shadowBlur=0;
  // Character
  x.font='84px serif';x.fillText(G.ch.emoji,cw/2,310);
  x.fillStyle='#f5f5f0';x.font='bold 26px Courier New';x.fillText(G.ch.name,cw/2,352);
  // Score
  x.fillStyle='#888';x.font='15px Courier New';x.fillText('REZULTAT',cw/2,420);
  x.fillStyle='#f1c40f';x.font='bold 110px Courier New';x.fillText(String(Math.floor(G.score)),cw/2,520);
  if(G.wasOD&&G.lastHard){x.fillStyle='#ff9999';x.font='17px Courier New';x.fillText(`uzrok: ${G.lastHard} × 3 zaredom`,cw/2,560);}
  else {x.fillStyle='#8fd4ff';x.font='bold 19px Courier New';x.fillText(`🚃 ${G.wagons} preskočenih vagona`+(G.coins?`  ·  🪙 ${G.coins}`:''),cw/2,560);}
  // Fact box
  const fact=CARD_FACTS[dc]||CARD_FACTS.crash;
  x.fillStyle='rgba(255,255,255,0.05)';x.fillRect(50,600,cw-100,180);
  x.strokeStyle='rgba(255,255,255,0.12)';x.lineWidth=1;x.strokeRect(50,600,cw-100,180);
  x.fillStyle=col;x.font='bold 15px Courier New';x.fillText('⚠  ZNAŠ LI?',cw/2,636);
  x.fillStyle='#e8e8e4';x.font='18px Courier New';
  // wrap fact
  const words=fact.split(' ');let line='',ly=672;
  words.forEach(w=>{const t=line+w+' ';if(x.measureText(t).width>cw-130&&line){x.fillText(line.trim(),cw/2,ly);line=w+' ';ly+=28;}else line=t;});
  if(line)x.fillText(line.trim(),cw/2,ly);
  // Footer
  x.fillStyle='#c0392b';x.font='bold 22px Courier New';x.fillText('#TrainspottingGame',cw/2,chh-58);
  x.fillStyle='#555';x.font='14px Courier New';x.fillText('Možeš li bolje? Igraj i podeli svoj rezultat.',cw/2,chh-32);
  x.textAlign='left';
  return cc;
}
async function shareCard(){
  let cc;try{cc=buildCard();}catch(e){return;}
  const cause=G.wasOD?'overdoze':G.deathCause==='anxiety'?'anksioznosti':G.deathCause==='gap'?'procepa među vagonima':'policije';
  const txt=`Skupio sam ${Math.floor(G.score)} bodova u Trainspotting Runner-u pre nego što me sredila doza ${cause}. Probaj i ti! #TrainspottingGame`;
  cc.toBlob(async(blob)=>{
    if(!blob)return;
    const file=new File([blob],'trainspotting-score.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Trainspotting Runner',text:txt});return;
      }
    }catch(e){if(e&&e.name==='AbortError')return;}
    // Fallback: download
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='trainspotting-score.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  },'image/png');
}
elShare.addEventListener('click',shareCard);

// ── LOOP ─────────────────────────────────────────
let prevT=0,uiSig='';
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-prevT,50);prevT=ts;
  G.t+=dt;G.fr++;
  if(isPortrait){render();return;}
  if(G.ph==='play'){if(!G.paused)update(dt);}
  else if(G.ph==='overdose'){G.ovT+=dt;if(G.ovT>6200)G.ph='dead';}
  render();
  const sig=G.ph+'|'+G.paused+'|'+MUTED;
  if(sig!==uiSig){uiSig=sig;syncUI();}
}
requestAnimationFrame(loop);
</script>
